<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>Register — Jobu</title>
  <link rel="stylesheet" href="css/styles.css">
</head>
<body>
  <header class="topbar">
    <div class="wrap">
      <a class="brand" href="index.html">
        <img src="assets/logo.png" alt="Jobu logo" class="logo" onerror="this.style.display='none'">
      </a>
    </div>
  </header>

  <main class="wrap form-wrap">
    <form id="registerForm" class="card form-card">
      <h2>Create account</h2>
      <input id="regName" type="text" class="input" placeholder="Full name" required />
      <input id="regEmail" type="email" class="input" placeholder="Email" required />
      <input id="regPassword" type="password" class="input" placeholder="Password" required />
      <button type="submit" class="btn btn-gradient">Register</button>

      <p class="muted small">For the demo, registration will attempt to call a server endpoint (`php/register.php`). If that isn't available, it will store a demo user locally (localStorage).</p>
      <p>Already have an account? <a href="login.html">Login</a></p>
    </form>
  </main>

  <script src="js/app.js" defer></script>
</body>
</html>
