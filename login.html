<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>Login — Jobu</title>
  <link rel="stylesheet" href="css/styles.css">
</head>
<body>
  <header class="topbar">
    <div class="wrap">
      <a class="brand" href="index.html">
        <img src="assets/logo.png" alt="Jobu logo" class="logo" onerror="this.style.display='none'">
      </a>
    </div>
  </header>

  <main class="wrap form-wrap">
    <form id="loginForm" class="card form-card">
      <h2>Login</h2>
      <input id="loginEmail" type="email" class="input" placeholder="Email" required />
      <input id="loginPassword" type="password" class="input" placeholder="Password" required />
      <button type="submit" class="btn btn-gradient">Login</button>

      <p class="muted small">Demo: if backend not configured, this page uses a local demo account saved to your browser (localStorage).</p>
      <p>Don't have an account? <a href="register.html">Register</a></p>
    </form>
  </main>

  <script src="js/app.js" defer></script>
</body>
</html>
